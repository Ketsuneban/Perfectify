name: Yeta — verify and build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'gradle.properties'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yeta-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and smoke-test Yeta
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile
        run: gradle --no-daemon clean build --stacktrace
      - name: Verify JAR
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -name 'yeta-*.jar' -type f | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" | grep -Fqx 'dev/ketsuneban/yeta/Yeta.class'
          jar tf "$JAR" | grep -Fqx 'yeta.mixins.json'
      - name: Verify dedicated server startup
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          setsid timeout 120s gradle --no-daemon runServer --console=plain --stacktrace > server-smoke.log 2>&1 &
          runner=$!
          ready=0
          for n in $(seq 1 115); do
            if grep -Fq 'Done (' server-smoke.log; then
              ready=1
              break
            fi
            if ! kill -0 "$runner" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -TERM -- "-$runner" 2>/dev/null || true
          wait "$runner" || true
          tail -50 server-smoke.log
          test "$ready" = 1
          if grep -Eq 'MixinApplyError|InvalidMixinException|InjectionError|Critical injection failure' server-smoke.log; then exit 1; fi
      - name: Verify client startup in virtual display
        shell: bash
        run: |
          command -v xvfb-run
          setsid timeout 150s env LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x720x24' gradle --no-daemon runClient --console=plain --stacktrace > client-smoke.log 2>&1 &
          runner=$!
          ready=0
          for n in $(seq 1 145); do
            if grep -Eiq 'OpenGL|Backend library|Created:.*atlas' client-smoke.log; then
              sleep 8
              ready=1
              break
            fi
            if ! kill -0 "$runner" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -TERM -- "-$runner" 2>/dev/null || true
          wait "$runner" || true
          tail -90 client-smoke.log
          test "$ready" = 1
          if grep -Eq 'MixinApplyError|InvalidMixinException|InjectionError|Critical injection failure|Failed to launch' client-smoke.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Yeta-verified-JAR
          path: build/libs/yeta-*.jar
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yeta-build-logs
          path: |
            server-smoke.log
            client-smoke.log
          if-no-files-found: ignore
          retention-days: 7
