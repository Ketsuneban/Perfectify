name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perfectify-0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish first preview release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="perfectify-v0.1.0"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; leaving published APK unchanged."
          else
            gh release create "$VERSION" app/build/outputs/apk/debug/app-debug.apk#Perfectify-0.1.0-debug.apk \
              --target "$GITHUB_SHA" \
              --title "Perfectify v0.1.0 - Android preview" \
              --notes "Первый тестовый APK. Браузер TikTok, приём ссылок из TikTok You, список загрузок и сохранение доступных видео. Скрытые и удалённые ролики недоступны. Debug-сборка для личного тестирования." \
              --prerelease
          fi
