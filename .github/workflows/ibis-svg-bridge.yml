name: ibis SVG Bridge (Android)

on:
  push:
    branches:
      - feature/ibis-svg-bridge
    paths:
      - 'ibis-svg-bridge/**'
      - '.github/workflows/ibis-svg-bridge.yml'
  pull_request:
    paths:
      - 'ibis-svg-bridge/**'
      - '.github/workflows/ibis-svg-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Verify inline editor JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('ibis-svg-bridge/app/src/main/assets/editor.html').read_text()
          assert html.count('<script>') == 1 and html.count('</script>') == 1
          Path('/tmp/ibis-svg-editor.js').write_text(html.split('<script>')[1].split('</script>')[0])
          PY
          node --check /tmp/ibis-svg-editor.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble APK
        run: gradle -p ibis-svg-bridge --no-daemon assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ibis-svg-bridge-debug-apk
          path: ibis-svg-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    name: Publish experimental SVG Bridge APK
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/ibis-svg-bridge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ibis-svg-bridge-debug-apk
          path: dist
      - name: Publish prerelease only if tag is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="ibis-svg-bridge-v0.2.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 0
          fi
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/ibis-svg-bridge-v0.2.0-debug.apk
          cat > release-notes.md <<'EOF'
          SVG Bridge for ibisPaint X — experimental Android preview.
          
          - Freehand vector brush with adjustable color, opacity and thickness.
          - Object/background fill tool.
          - Nondestructive SVG-mask eraser.
          - Draggable floating editor over ibisPaint X.
          - Save SVG and export transparent PNG for ibisPaint.
          
          NOTE: This is an unofficial, independent overlay companion app, NOT a plugin inside the official ibisPaint canvas. The fill tool is not a pixel flood fill. This APK is debug-signed for testing; install at your own risk. Original ibisPaint X is unmodified.
          EOF
          gh release create "$TAG" dist/ibis-svg-bridge-v0.2.0-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SVG Bridge v0.2.0 (Android preview)" \
            --notes-file release-notes.md \
            --prerelease
